name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node.js and Claude Code versions
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any secrets or tokens first.
